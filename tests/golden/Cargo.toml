[package]
name = "engine_golden"
description = "Golden-image render tests: fixed scenes on both reference GPUs, compared with FLIP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Reading and writing the golden images (the version engine_assets uses).
png = "0.18"
engine_anim.workspace = true
# Shots rendered by the player, the path games run (ADR 0099).
engine_app.workspace = true
engine_assets.workspace = true
# Brixelizer GI's shots, probe GI's reference (ADR 0090).
engine_brixelizer.workspace = true
engine_core.workspace = true
# The frame renderer the shots go through (ADR 0072), and DLSS's Streamline for its shot.
engine_dlss.workspace = true
engine_frame.workspace = true
engine_render.workspace = true
# The UI layer drawn over frame generation's shots (ADR 0091).
engine_render2d.workspace = true
engine_rhi.workspace = true
# Shots streamed within a GPU budget (ADR 0076).
engine_streaming.workspace = true
# The runtime path (ECS extraction into a GPU scene, camera entities; ADR 0064, ADR 0072).
engine_ecs.workspace = true
engine_runtime.workspace = true
# The CPU check's spinning component (`cpu.rs`): its derive names the crate; already in the
# tree through engine_ecs.
bytemuck = { version = "1.25", features = ["derive"] }
