[package]
name = "engine_cli"
description = "The `ofeliaengine` command line: shader builds today; cooking, packing and benchmarks later."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ofeliaengine"
path = "src/main.rs"

[dependencies]
# Cooking scenes into packs (ADR 0056).
engine_assets.workspace = true
engine_core.workspace = true
# Logging and crash reports (ADR 0061).
engine_crash.workspace = true
engine_log.workspace = true
# Localized text (ADR 0102): `loc build` and `loc check`.
engine_loc.workspace = true
# `save dump` and `save info` (ADR 0104).
engine_save.workspace = true
# Fresh asset ids for a new game's scene and materials (`new`); already built for
# engine_save.
engine_scene.workspace = true
# `edit`: the editor and its restarts waited for in one job (already built for the rest).
engine_platform.workspace = true
# `edit`: cargo's JSON messages (already in the tree through glTF import).
serde_json = "1"
engine_shader.workspace = true
# Colliders baked into Jolt's binary form for packs (ADR 0101).
engine_physics.workspace = true
engine_physics_jolt.workspace = true
