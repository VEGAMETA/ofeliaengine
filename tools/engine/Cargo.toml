version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ofeliaengine"
path = "src/main.rs"

[dependencies]
# Cooking scenes into packs (ADR 0056).
engine_assets.workspace = true
