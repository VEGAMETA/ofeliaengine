[build]
# The build on the NVMe drive: rebuilding every test after a change in engine_core takes
# 11-15 s there, 40-58 s on the SATA HDD that holds the repository (ref-1, ADR 0077).
# CARGO_TARGET_DIR overrides it: agents' worktrees build in C:/cargo-target/<task>.
target-dir = "C:/cargo-target/ofeliaengine"

[target.x86_64-pc-windows-msvc]
# `rust-lld` ships with rustup; for the MSVC target rustc drives it in `lld-link` flavor.
# No separate LLVM install is needed (ADR 0001).
linker = "rust-lld.exe"
# Baseline ISA = Windows 11 24H2 minimum (CLAUDE.md §5). AVX2/AVX-512 only via runtime
# dispatch. Raising this requires an ADR.
rustflags = ["-C", "target-cpu=x86-64-v2"]

[alias]
# One button for a Tracy build (CLAUDE.md §15: `profiling` = release + debug info + Tracy).
# Cargo profiles cannot enable features, hence the alias. See docs/dev-guide/profiling.md.
profiling = "build --workspace --profile profiling --features engine_profiler/tracy"
