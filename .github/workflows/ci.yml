name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Everything runs on Windows x64 (CLAUDE.md §15). The toolchain comes from
# rust-toolchain.toml; rustup installs it on first use.
jobs:
  fmt:
    name: rustfmt
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.profile }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release, profiling, shipping]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}

  deny:
    name: cargo-deny
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      # cargo-deny-action is a Docker action (Linux only), so install the binary instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  docs:
    name: docs
    runs-on: windows-2025
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
