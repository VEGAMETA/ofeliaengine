name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Everything runs on Windows x64 (CLAUDE.md §15). The toolchain comes from
# rust-toolchain.toml; rustup installs it on first use.
#
# One job instead of one per check: hosted Windows minutes on a private repository are
# limited, and every extra job pays for checkout + toolchain install again. Steps use
# `if: !cancelled()` so one failing check does not hide the others.
jobs:
  check:
    name: check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # cargo-deny-action is a Docker action (Linux only), so install the binary instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked
      - name: docs
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: cargo deny --locked check
      - name: build (all profiles)
        if: ${{ !cancelled() }}
        run: |
          foreach ($p in 'dev', 'release', 'profiling', 'shipping') {
            cargo build --workspace --all-targets --locked --profile $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
