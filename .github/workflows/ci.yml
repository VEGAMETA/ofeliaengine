name: CI

on:
  # On demand only (ADR 0037): every change is checked before merging on ref-1 itself with
  # tools/check.ps1 (the same commands), and ref-1 is also this runner, so an automatic run
  # would build the same commit a second time on the same cores. Run it by hand
  # (workflow_dispatch), or on a pull request with the `ci` label: on the event that adds
  # it and on every push while it is on.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Documentation-only changes need no build.
    paths-ignore:
      - docs/**
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The vendored Jolt + JoltC static library, built once per content hash and shared by
  # every profile, clippy and tests (crates/engine_physics_jolt/build.rs). It lives in the
  # runner's work folder, which persists between runs.
  ENGINE_JOLTC_CACHE: ${{ github.workspace }}\.joltc-cache

# Everything runs on Windows x64 (CLAUDE.md §15), on the self-hosted reference machine
# (ref-1), like the GPU and bench workflows: hosted Windows minutes on a private repository
# are billed, and runs stopped when the account's spending limit was reached. The
# toolchain comes from rust-toolchain.toml; rustup installs it on first use.
#
# The checkout keeps untracked files (`clean: false`), so `target/` and the Jolt cache
# persist between runs and builds are incremental; `--locked` and fresh checkouts of
# tracked files keep them honest. Steps use `if: !cancelled()` so one failing check does
# not hide the others.
#
# Each check writes its output to logs/<check>.txt. On failure the tails of the failed logs are
# posted as a commit comment: job logs live in Azure blob storage, which the automation
# working on this repository cannot read (see .github/scripts/post-commit-comment.ps1).
jobs:
  check:
    name: check
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci'))
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      # cargo-deny-action is a Docker action (Linux only), so install the binary instead:
      # once per runner (it stays in ~/.cargo/bin), pinned to a minor version.
      - name: install cargo-deny
        run: |
          cargo deny --version 2>nul | findstr /c:"cargo-deny 0.20" >nul || cargo install cargo-deny --locked --version ~0.20
      # Two lines: in cmd, `if exist logs rmdir ... & mkdir logs` would make the mkdir part
      # of the `if` and skip it when the folder is missing (other workflows' checkouts on
      # this machine clean untracked files). Without the folder every `> logs\...`
      # redirection fails and cmd skips the command without setting ERRORLEVEL.
      - name: fresh logs folder
        run: |
          if exist logs rmdir /s /q logs
          mkdir logs

      - name: rustfmt
        run: |
          cargo fmt --all --check > logs\rustfmt.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\rustfmt.failed
          type logs\rustfmt.txt
          exit /b %rc%
      - name: clippy
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings > logs\clippy.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\clippy.failed
          type logs\clippy.txt
          exit /b %rc%
      - name: test
        if: ${{ !cancelled() }}
        run: |
          cargo test --workspace --locked > logs\test.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\test.failed
          type logs\test.txt
          exit /b %rc%
      - name: test (Tracy enabled)
        if: ${{ !cancelled() }}
        # No profiler connects to the tests: skip the Tracy client's symbol loading at start
        # (DbgHelp over every module, 4-15 s per test process on ref-1).
        env:
          TRACY_SYMBOL_OFFLINE_RESOLVE: "1"
        run: |
          cargo test --workspace --locked --features engine_profiler/tracy > logs\test-tracy.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\test-tracy.failed
          type logs\test-tracy.txt
          exit /b %rc%
      - name: docs
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked > logs\docs.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\docs.failed
          type logs\docs.txt
          exit /b %rc%
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: |
          cargo deny --locked check > logs\deny.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\deny.failed
          type logs\deny.txt
          exit /b %rc%
      # Model checks of the lock-free queues. Separate target dir: `--cfg loom` would
      # otherwise invalidate the cached normal build.
      - name: loom
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: --cfg loom
          CARGO_TARGET_DIR: target/loom
        run: |
          cargo test -p engine_core --release --lib --locked loom > logs\loom.txt 2>&1
          set rc=%ERRORLEVEL%
          if not %rc%==0 echo.> logs\loom.failed
          type logs\loom.txt
          exit /b %rc%
      - name: build (all profiles)
        if: ${{ !cancelled() }}
        run: |
          set log=logs\build.txt
          cargo build --workspace --all-targets --locked --profile dev > %log% 2>&1 || goto fail
          cargo build --workspace --all-targets --locked --profile release >> %log% 2>&1 || goto fail
          cargo build --workspace --all-targets --locked --profile shipping >> %log% 2>&1 || goto fail
          rem The profiling profile is built the way `cargo profiling` builds it: with Tracy.
          cargo build --workspace --all-targets --locked --profile profiling --features engine_profiler/tracy >> %log% 2>&1 || goto fail
          type %log%
          exit /b 0
          :fail
          echo.> logs\build.failed
          type %log%
          powershell -NoProfile -Command "Get-Content -Encoding UTF8 logs\build.txt -Tail 30 | ForEach-Object { '::error title=build::' + $_ }"
          exit /b 1

      # Posted from cmd through `powershell -File`, as the GPU and bench workflows do on
      # this machine. Every log's tail, so a failing run is diagnosable without job logs.
      - name: Post logs as commit comment
        if: ${{ always() }}
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo cd: %CD% > logs\env.txt
          where cargo >> logs\env.txt 2>&1
          cargo --version >> logs\env.txt 2>&1
          dir logs >> logs\env.txt 2>&1
          powershell -NoProfile -Command "$md = @(); foreach ($f in Get-ChildItem logs -Filter *.txt) { $md += '#### ' + $f.BaseName; $md += ''; $md += '```'; $n = 40; if (Test-Path (Join-Path logs ($f.BaseName + '.failed'))) { $n = 150 }; $md += (Get-Content -Encoding UTF8 $f.FullName | Select-Object -Last $n); $md += '```'; $md += '' }; $md | Out-File -Encoding utf8 ci-report.md"
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/post-commit-comment.ps1 -Title "CI check (ref-1): log tails" -Files ci-report.md
