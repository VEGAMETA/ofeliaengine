name: Bench

# Benchmarks on the self-hosted reference machine (docs/perf/reference-hw.md, ref-1).
# The report is posted as a commit comment. ref-1 is not a dedicated machine, so the
# numbers are advisory: no regression gate yet (ADR 0001, ADR 0002).
on:
  # On demand only (ADR 0037): benchmarks are run on ref-1 by hand when a change can move
  # them, and the numbers go to docs/perf/history.md. Here: by hand (workflow_dispatch), or
  # when a pull request gets the `bench` label, for a report posted on the commit.
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: bench
    if: github.event_name != 'pull_request' || github.event.label.name == 'bench'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5

      - name: cargo bench -p engine_core --bench jobs
        shell: cmd
        run: cargo bench -p engine_core --bench jobs --locked > bench-jobs.md

      - name: cargo bench -p engine_profiler --bench zones (both Tracy modes)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          cargo bench -p engine_profiler --features tracy --bench zones --locked > bench-zones.md
          cargo bench -p engine_profiler --features tracy-ondemand --bench zones --locked >> bench-zones.md

      - name: cargo bench -p engine_platform --bench timers
        if: ${{ !cancelled() }}
        shell: cmd
        run: cargo bench -p engine_platform --bench timers --locked > bench-timers.md

      - name: cargo bench -p engine_render2d --bench canvas
        if: ${{ !cancelled() }}
        shell: cmd
        run: cargo bench -p engine_render2d --bench canvas --locked > bench-canvas.md

      - name: cargo bench -p engine_physics_jolt --bench physics
        if: ${{ !cancelled() }}
        shell: cmd
        run: cargo bench -p engine_physics_jolt --bench physics --locked > bench-physics.md

      - name: cargo bench -p engine_ecs --bench ecs
        if: ${{ !cancelled() }}
        shell: cmd
        run: cargo bench -p engine_ecs --bench ecs --locked > bench-ecs-engine.md

      - name: cargo bench -p engine_scene --bench scene
        if: ${{ !cancelled() }}
        shell: cmd
        run: cargo bench -p engine_scene --bench scene --locked > bench-scene.md

      - name: cargo bench -p engine_audio --bench mixer, and output device timing (muted)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          cargo bench -p engine_audio --bench mixer --locked > bench-audio.md
          set rc=%ERRORLEVEL%
          echo.>> bench-audio.md
          cargo run -p engine_audio --release --example tone --locked -- --seconds 4 --mute >> bench-audio.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
      - name: cargo bench -p engine_text --bench text, and the text layout comparison
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          cargo bench -p engine_text --bench text --locked > bench-text.md
          set rc=%ERRORLEVEL%
          echo.>> bench-text.md
          cargo run -q --release --locked --manifest-path bench/text-compare/Cargo.toml >> bench-text.md
          exit /b %rc%

      - name: ECS comparison (research harness for ADR 0017, outside the workspace)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: cmd
        run: cargo run --release --locked --manifest-path bench/ecs-compare/Cargo.toml > bench-ecs.md 2>&1

      - name: Post report as commit comment
        if: ${{ !cancelled() }}
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/post-commit-comment.ps1 -Title "Bench (ref-1)" -Files bench-jobs.md,bench-zones.md,bench-timers.md,bench-canvas.md,bench-physics.md,bench-ecs-engine.md,bench-scene.md,bench-audio.md,bench-text.md,bench-ecs.md
