name: GPU

# Vulkan tests on real GPUs: the self-hosted reference machine (ref-1) has an NVIDIA dGPU
# and an AMD iGPU, so every run covers both priority vendors. The Vulkan SDK there provides
# the validation layer; tests fail on any validation error. Output is posted as a commit
# comment (job logs are not readable by the automation working on this repository).
on:
  pull_request:
    paths:
      - crates/engine_rhi/**
      - crates/engine_platform/**
      - crates/engine_shader/**
      - crates/engine_render/**
      - crates/engine_render2d/**
      - crates/engine_latency/**
      - crates/engine_text/**
      - tools/**
      - Cargo.lock
      - .github/workflows/gpu.yml
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    name: gpu (NVIDIA + AMD + Slang)
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      ENGINE_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5

      - name: engine_rhi tests, default adapter (discrete)
        shell: cmd
        run: |
          echo ## Default adapter> gpu-default.md
          echo.>> gpu-default.md
          echo ```>> gpu-default.md
          cargo test -p engine_rhi --locked -- --nocapture --test-threads=1 >> gpu-default.md 2>&1
          set rc=%ERRORLEVEL%
          echo ```>> gpu-default.md
          exit /b %rc%

      - name: engine_rhi tests, AMD iGPU (ENGINE_ADAPTER=radeon)
        if: ${{ !cancelled() }}
        shell: cmd
        env:
          ENGINE_ADAPTER: radeon
        run: |
          echo ## ENGINE_ADAPTER=radeon> gpu-radeon.md
          echo.>> gpu-radeon.md
          echo ```>> gpu-radeon.md
          cargo test -p engine_rhi --locked -- --nocapture --test-threads=1 >> gpu-radeon.md 2>&1
          set rc=%ERRORLEVEL%
          echo ```>> gpu-radeon.md
          exit /b %rc%

      - name: Render graph tests and benchmark, NVIDIA and AMD
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          echo ## Render graph (synchronization validation)> render.md
          echo.>> render.md
          echo ```>> render.md
          cargo test -p engine_render --locked -- --nocapture --test-threads=1 >> render.md 2>&1
          set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo test -p engine_render --locked --test graph --test mesh --test forward -- --nocapture >> render.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=
          echo ```>> render.md
          echo.>> render.md
          cargo bench -p engine_render --bench graph --locked >> render.md 2>&1
          set ENGINE_ADAPTER=radeon
          cargo bench -p engine_render --bench graph --locked >> render.md 2>&1
          exit /b %rc%

      - name: Windowed smoke test (cubes example, present through the graph, validation)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          echo ## Cubes example (window + swapchain + graph, debug build with validation)> cubes.md
          echo.>> cubes.md
          echo ```>> cubes.md
          cargo run -p engine_render --example cubes --locked -- fifo 2 300 >> cubes.md 2>&1
          set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo run -p engine_render --example cubes --locked -- fifo 2 300 >> cubes.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          echo ```>> cubes.md
          exit /b %rc%

      - name: 2D renderer tests, windowed demo and benchmark, NVIDIA and AMD
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          echo ## 2D renderer (synchronization validation)> render2d.md
          echo.>> render2d.md
          echo ```>> render2d.md
          cargo test -p engine_render2d --locked -- --nocapture --test-threads=1 >> render2d.md 2>&1
          set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo test -p engine_render2d --locked --test render2d --test viewports -- --nocapture >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=
          cargo run -p engine_render2d --example sprites --locked -- fifo 20000 300 >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo run -p engine_render2d --example sprites --locked -- fifo 20000 300 >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          cargo run -p engine_render2d --example viewports --locked -- 300 >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=
          cargo run -p engine_render2d --example viewports --locked -- 300 >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          echo ```>> render2d.md
          echo.>> render2d.md
          cargo run -p engine_render2d --release --example sprite_bench --locked >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo run -p engine_render2d --release --example sprite_bench --locked >> render2d.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          exit /b %rc%

      - name: Latency (Reflex / Anti-Lag 2 / generic), NVIDIA and AMD
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          echo ## Latency: validation run (debug, 60 frames per configuration)> latency.md
          echo.>> latency.md
          echo ```>> latency.md
          cargo run -p engine_latency --example latency --locked -- 60 8 >> latency.md 2>&1
          set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo run -p engine_latency --example latency --locked -- 60 4 >> latency.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          echo ```>> latency.md
          echo.>> latency.md
          set ENGINE_ADAPTER=
          cargo run -p engine_latency --release --example latency --locked -- 300 48 >> latency.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo run -p engine_latency --release --example latency --locked -- 300 12 >> latency.md 2>&1
          if %rc% equ 0 set rc=%ERRORLEVEL%
          exit /b %rc%

      - name: Memory allocator benchmark, NVIDIA and AMD (release)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          cargo bench -p engine_rhi --bench memory --locked > memory-bench.md 2>&1
          set rc=%ERRORLEVEL%
          set ENGINE_ADAPTER=radeon
          cargo bench -p engine_rhi --bench memory --locked >> memory-bench.md 2>&1
          if %rc% neq 0 exit /b %rc%

      - name: engine_shader tests (Slang from the Vulkan SDK)
        if: ${{ !cancelled() }}
        shell: cmd
        env:
          ENGINE_REQUIRE_SLANG: "1"
        run: |
          echo ## Shader compiler (Slang from VULKAN_SDK)> shader.md
          echo.>> shader.md
          echo ```>> shader.md
          dir /b "%VULKAN_SDK%\Bin\slang*" >> shader.md 2>&1
          cargo test -p engine_shader --locked -- --nocapture --test-threads=1 >> shader.md 2>&1
          set rc=%ERRORLEVEL%
          echo ```>> shader.md
          exit /b %rc%

      - name: Shader build and hot reload benchmark (release)
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          echo ## engine shaders build (CLI smoke test)> shader-bench.md
          echo.>> shader-bench.md
          echo ```>> shader-bench.md
          cargo run -p engine_cli --release --locked -- shaders build --cache target\shader-cache-smoke crates >> shader-bench.md 2>&1
          set rc=%ERRORLEVEL%
          echo ```>> shader-bench.md
          echo.>> shader-bench.md
          cargo run -p engine_shader --release --locked --example shader_bench >> shader-bench.md 2>&1
          if %rc% neq 0 exit /b %rc%

      - name: Post report as commit comment
        if: ${{ !cancelled() }}
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/post-commit-comment.ps1 -Title "GPU tests (ref-1)" -Files gpu-default.md,gpu-radeon.md,render.md,cubes.md,render2d.md,latency.md,memory-bench.md,shader.md,shader-bench.md
