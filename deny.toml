# cargo-deny configuration (CLAUDE.md §15). Run: `cargo deny check`.

[graph]
# The engine targets only Windows 11 x64; ignore dependencies of other platforms.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste`, a proc macro of rav1d's (ADR 0100), is archived: unmaintained, with no
    # vulnerability, and it runs only while building. Remove once rav1d no longer uses it.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro of rav1d, archived, no vulnerability" },
]

[licenses]
version = 2
# CLAUDE.md §15 allowed list. MPL-2.0 only via ADR (add a per-crate exception below).
# GPL/LGPL/AGPL are forbidden and must never appear here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Public domain dedications.
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93
# The allow-list is policy, not a record of what is currently used.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Our own crates are `publish = false` and carry no license until the team picks one.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Async runtimes are banned from the core (CLAUDE.md §5). Tools may add a wrapper exception.
deny = [
    { crate = "tokio", reason = "no async runtime in the core (CLAUDE.md §5)" },
    { crate = "async-std", reason = "no async runtime in the core (CLAUDE.md §5)" },
    { crate = "smol", reason = "no async runtime in the core (CLAUDE.md §5)" },
    { crate = "wgpu", reason = "Vulkan via ash only, no intermediate layers (CLAUDE.md §1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
