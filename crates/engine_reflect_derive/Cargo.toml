[package]
name = "engine_reflect_derive"
description = "#[derive(Reflect)] for engine_reflect: static field tables with offsets and attributes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

# The same syn/quote the workspace already builds for bytemuck's derive.
[dependencies]
proc-macro2 = "1"
quote = "1"
# The features every build that has engine_loc resolves anyway (ICU4X's derives; ADR 0077:
# a proc macro does not depend on the workspace hack, so they are named here).
syn = { version = "3", features = ["extra-traits", "fold", "visit"] }
