[package]
name = "engine_editor"
description = "Editor core: undoable transactions over the world; panels and tools build on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Luau's own type checker and linter for the code editor (ADR 0107 §6, E8-3).
engine_luau_analysis.workspace = true
# Slang's front end, checking the code editor's Slang modules (ADR 0107's E10-2a).
engine_shader.workspace = true
# The player the editor runs inside of (ADR 0107): the game's world, its renderer, the
# window.
engine_app.workspace = true
# A dropped model's outline, read from its glTF (ADR 0107 E4-3); the bake's glb read back
# in tests.
engine_assets.workspace = true
# Brushes' planes, solids and faces, for editing them (ADR 0110 E2b-5).
engine_brush.workspace = true
# Material graphs opened in tabs of their own and edited on a canvas (ADR 0123 E10-3d).
engine_material_graph.workspace = true
engine_core.workspace = true
# Logging and crash reports of the editor application (ADR 0061).
engine_crash.workspace = true
engine_ecs.workspace = true
engine_log.workspace = true
log = "0.4"
# The blockout's navigation mesh, baked in the background for the overlay (ADR 0110 E2b-4b).
engine_nav.workspace = true
engine_input.workspace = true
# The window, the 3D viewport, the device and frame pacing: the editor application
# (`src/bin/editor.rs`).
engine_latency.workspace = true
engine_platform.workspace = true
engine_profiler.workspace = true
engine_reflect.workspace = true
engine_render.workspace = true
engine_render2d.workspace = true
engine_rhi.workspace = true
engine_runtime.workspace = true
engine_scene.workspace = true
engine_text.workspace = true
engine_ui.workspace = true
# Play (ADR 0107 E3): the game's hooks run through the editor, their types with them (the
# UI layer's canvases, the physics sound travels through, saves).
engine_frame.workspace = true
engine_physics.workspace = true
engine_save.workspace = true
# Cargo's build messages, read as JSON (E1-5c; already in the tree through glTF import);
# the script debugger's DAP messages (ADR 0119 E9-2).
serde_json = "1"
# The DAP session's token, from the system's random generator (ADR 0119 E9-2).
engine_net_transport.workspace = true

[dev-dependencies]
