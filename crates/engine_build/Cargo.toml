[package]
name = "engine_build"
description = "The one-button game build (ADR 0126): the build file, the walk from the scenes to every asset they reach, the game built by cargo and its folder written."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Feature unification of shared dependencies for build reuse (ADR 0077).
engine_workspace_hack.workspace = true
engine_assets.workspace = true
# The material pack's key (ADR 0113's content hash).
engine_core.workspace = true
engine_reflect.workspace = true
engine_scene.workspace = true
# Scripts compiled to Luau bytecode (ADR 0126's G5c).
engine_script.workspace = true

[dev-dependencies]
# Whether Slang is at hand for the material pack's test.
engine_shader.workspace = true
# Images for the derived data pack's test (already built for engine_assets).
png = "0.18"
