[package]
name = "engine_render"
description = "Render graph and renderers on top of engine_rhi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Push constants as plain bytes without unsafe (ADR 0052); the version engine_ecs uses.
bytemuck = { version = "1.25", features = ["derive"] }
engine_core.workspace = true
# Mesh and material ids described for saves (ADR 0104).
engine_reflect.workspace = true
engine_profiler.workspace = true
engine_rhi.workspace = true
# Material types compiled on first use, on a thread of their own (ADR 0092); loads the
# Slang library at run time, so a game without types never touches it.
engine_shader.workspace = true
# A type that does not compile is logged; its fallback draws (the version engine_rhi uses).
log = "0.4"
# Directory watchers for hot reload of material types' modules (ADR 0092).
engine_platform.workspace = true

[[bench]]
name = "graph"
harness = false

[dev-dependencies]
# glTF scenes for examples/scene_bench.rs.
engine_assets.workspace = true
# zstd into staging memory in examples/staging_bench.rs (ADR 0057).
zstd = { version = "0.14.3", default-features = false }
# The deliberate GPU fault test writes its report to a temporary directory (ADR 0061).
engine_log.workspace = true
