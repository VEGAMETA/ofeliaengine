[package]
name = "engine_render"
description = "Render graph and renderers on top of engine_rhi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Push constants as plain bytes without unsafe (ADR 0052); the version engine_ecs uses.
bytemuck = { version = "1.25", features = ["derive"] }
engine_core.workspace = true
engine_profiler.workspace = true
engine_rhi.workspace = true

[[bench]]
name = "graph"
harness = false

[dev-dependencies]
# Recompiles the committed shaders to check them against their source.
engine_shader.workspace = true
# glTF scenes for examples/scene_bench.rs.
engine_assets.workspace = true
# Unbuffered reads (all hosts) for examples/staging_bench.rs and Windows helpers.
engine_platform.workspace = true
# zstd into staging memory in examples/staging_bench.rs (ADR 0057).
zstd = { version = "0.13", default-features = false }
