[package]
name = "engine_rhi"
description = "Thin Vulkan 1.3 layer over ash: instance, adapter selection, device, queues."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Vulkan bindings (MIT OR Apache-2.0). `loaded`: vulkan-1.dll is loaded at run time, so a
# missing driver is an error value, not a start-up failure (ADR 0006).
ash = "0.38"
engine_profiler.workspace = true

[dev-dependencies]
# Benchmark reference only (ADR 0010): MIT OR Apache-2.0; not linked into the engine.
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

[target.'cfg(windows)'.dev-dependencies]
engine_platform.workspace = true

[[bench]]
name = "memory"
harness = false
