[package]
name = "engine_rhi"
description = "Thin Vulkan 1.3 layer over ash: instance, adapter selection, device, queues."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Vulkan bindings (MIT OR Apache-2.0). `loaded`: vulkan-1.dll is loaded at run time, so a
# missing driver is an error value, not a start-up failure (ADR 0006).
ash = "0.38"
# The pipeline cache file's checksum and the job pool pipelines are created on (ADR 0055).
engine_core.workspace = true
engine_profiler.workspace = true
# Validation messages and GPU fault reports go to the log; fault reports and breadcrumbs
# into crash reports (ADR 0061).
engine_log.workspace = true
log = "0.4"

# Keeping the Vulkan loader's layers and drivers loaded for the process (`modules.rs`):
# already in the tree (engine_platform, engine_dlss…), MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Benchmark reference only (ADR 0010): MIT OR Apache-2.0; not linked into the engine.
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

[target.'cfg(windows)'.dev-dependencies]
engine_platform.workspace = true

[[bench]]
name = "memory"
harness = false
