[package]
name = "engine_workspace_hack"
description = "Feature unification (ADR 0077): every build resolves the shared dependencies that differed (bytemuck, windows-sys, serde, parking_lot, smallvec, cc, ...) with the same features, so a build of some packages reuses the whole workspace's instead of making copies of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Cargo keys a compiled unit by its own features, not its dependencies': when a build of a
# few packages (`-p`) resolves a shared dependency with fewer features than the whole
# workspace does, every crate above it is rebuilt into the same files, and the next
# workspace build rebuilds them back. The dependencies below were the ones that differed
# (2026-10-10, `cargo tree -e features`): bytemuck under everything (glam, engine_ecs),
# windows-sys under everything from engine_platform up, serde, serde_json, parking_lot and
# lock_api under the crash reporter, glTF import and the editor. Every engine crate but the
# proc macros depends on this one, so every package resolves them with the union of what
# the workspace enables. `tools/feature-drift.ps1` lists dependencies that differ again
# (run by `tools/check.ps1 -Deny`, the check for dependency changes): add them here.

[dependencies]
# Found 2026-10-23, when tools/feature-drift.ps1 learned to see copies resolved with no
# features at all: `std` (their default) from rayon (crossbeam-utils, either), mlua and the
# crash reporter's minidump crates (num-traits), gpu-allocator and fluent-syntax
# (thiserror); `serde` from ron (bitflags); `const_new` from ICU4X's fixed_decimal
# (smallvec, ADR 0102). Builds without those crates (engine_crash, engine_anim,
# engine_core's tests and most single packages) resolved them bare.
bitflags = { version = "2", features = ["serde"] }
bytemuck = { version = "1.25", features = [
    "aarch64_simd",
    "derive",
    "extern_crate_alloc",
    "min_const_generics",
    "wasm_simd",
] }

crossbeam-utils = "0.8"
either = "1"
lock_api = { version = "0.4", features = ["arc_lock", "atomic_usize"] }
# `std` (its default) from fluent-syntax (ADR 0102), in every build that has engine_loc.
memchr = "2"
num-traits = "0.2"
parking_lot = { version = "0.12", features = ["arc_lock"] }
# `alloc` for ron (material files, ADR 0092).
serde = { version = "1", features = ["alloc", "derive"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = { version = "1", features = ["const_generics", "const_new"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Graphics_Direct3D",
    "Wdk_Storage_FileSystem",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Dependencies built for the host (proc macros) are resolved apart from the target's: they
# are unified here, as build dependencies (hence the empty build script). `syn` gets `full`
# from zerocopy-derive (through `half`, ADR 0083) in every build that has engine_assets, and
# not in the others, which rebuilt every proc macro and their users in turn; `extra-traits`
# from strum_macros (through rav1d, ADR 0100) in every build that has engine_video. Syn 3
# gets `extra-traits`, `fold` and `visit` from ICU4X's derives (synstructure, yoke-derive,
# zerofrom-derive, zerovec-derive; ADR 0102) in every build that has engine_loc. `cc` gets
# `parallel` from luau0-src (mlua, ADR 0032) in every build that has engine_script, and not
# in the others (2026-10-23): those built every C and C++ build script again (mimalloc's
# under engine_core, Jolt's, Box2D's), and every crate above them.
[build-dependencies]
cc = { version = "1", features = ["parallel"] }
syn = { version = "2", features = ["extra-traits", "full"] }
syn3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "visit"] }
