[package]
name = "engine_script"
description = "Luau scripting: sandboxed VM with native codegen, module hot reload, time and memory limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine_core.workspace = true
engine_profiler.workspace = true
# Luau (MIT) through mlua (MIT): vendored Luau sources built with cc; `luau-jit` enables
# Luau's native code generator (x64). ADR 0032.
mlua = { version = "0.12", features = ["luau", "luau-jit"] }

[dev-dependencies]
# Fibers: the stops' tests run their calls on one, as the editor's player does.
engine_platform.workspace = true

[[bench]]
name = "boids"
harness = false
