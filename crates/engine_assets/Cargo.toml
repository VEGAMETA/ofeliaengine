[package]
name = "engine_assets"
description = "Asset import: glTF 2.0 into memory (meshes, PBR materials, node hierarchy) and into the ECS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Mesh simplification for LOD chains (MIT OR Apache-2.0; builds meshoptimizer, MIT); ADR 0053.
meshopt = "0.6"
engine_core.workspace = true
engine_ecs.workspace = true
# Unbuffered reads through an I/O ring for packs (ADR 0056).
engine_platform.workspace = true
engine_profiler.workspace = true
# Pack entries (ADR 0056): the zstd library (BSD-3-Clause), built from source by zstd-sys
# (MIT OR Apache-2.0) with `cc`, like meshoptimizer. Chosen over lz4 and deflate by
# measurement: BC7 to 65-69%, geometry to 42-50%, decoding at 1.0-1.3 GB/s per thread.
zstd = { version = "0.13", default-features = false }
# Already in the tree through engine_ecs: the plain-data proof for `MeshInstance`.
bytemuck = { version = "1.25", features = ["derive"] }
# glTF 2.0 document model and accessor readers (MIT OR Apache-2.0). Without default
# features: no image decoding, no URL handling — buffers are resolved here, textures are
# decoded by the texture pipeline later. ADR 0033.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_emissive_strength"] }
# PNG decoding (MIT OR Apache-2.0): image-rs' decoder, the fastest in Rust (ADR 0040).
png = "0.18"
# JPEG decoding (MIT OR Apache-2.0 OR Zlib): as fast as libjpeg-turbo, pure Rust.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86"] }
# BC1-5 and BC7 block compression (MIT): a Rust port of Intel's ISPC Texture Compressor
# kernels, CPU only (no wgpu). ADR 0041.
block_compression = { version = "0.10", default-features = false, features = ["bc15", "bc7"] }
