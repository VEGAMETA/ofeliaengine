[package]
name = "engine_assets"
description = "Asset import: glTF 2.0 into memory (meshes, PBR materials, node hierarchy) and into the ECS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Mesh simplification for LOD chains (MIT OR Apache-2.0; builds meshoptimizer, MIT); ADR 0053.
meshopt = "0.6"
# Skeletons and compressed clips of glTF skins and animations (ADR 0068).
engine_anim.workspace = true
# Colliders made from meshes: hulls, fitted primitives, the collider data (ADR 0101).
engine_collision.workspace = true
# The cook bakes navigation meshes (ADR 0103).
engine_nav.workspace = true
engine_core.workspace = true
engine_ecs.workspace = true
# Material files in the editor's grammar, reflected (ADR 0120).
engine_reflect.workspace = true
engine_scene.workspace = true
# Material graphs made modules where a material file names one (ADR 0123).
engine_material_graph.workspace = true
# Unbuffered reads through an I/O ring for packs (ADR 0056).
engine_platform.workspace = true
engine_profiler.workspace = true
# Pack entries (ADR 0056): the zstd library (BSD-3-Clause), built from source by zstd-sys
# (MIT OR Apache-2.0) with `cc`, like meshoptimizer. Chosen over lz4 and deflate by
# measurement: BC7 to 65-69%, geometry to 42-50%, decoding at 1.0-1.3 GB/s per thread.
zstd = { version = "0.14.3", default-features = false }
# Already in the tree through engine_ecs: the plain-data proof for `MeshInstance`.
bytemuck = { version = "1.25", features = ["derive"] }
# glTF 2.0 document model and accessor readers (MIT OR Apache-2.0). Without default
# features: no image decoding, no URL handling — buffers are resolved here, textures are
# decoded by the texture pipeline later. ADR 0033.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extensions", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_materials_volume"] }
# OpenEXR panoramas (BSD-3-Clause; ADR 0083): Poly Haven's and Blender's EXRs are PIZ
# compressed, which is not an hour's work. Without rayon (default feature). 1.74.0 exactly:
# 1.74.1 added lossy DWA compression through pulp, which brings the unmaintained paste
# (RUSTSEC-2024-0436) and seven more crates.
exr = { version = "=1.74.0", default-features = false }
# PNG decoding (MIT OR Apache-2.0): image-rs' decoder, the fastest in Rust (ADR 0040).
png = "0.18"
# JPEG decoding (MIT OR Apache-2.0 OR Zlib): as fast as libjpeg-turbo, pure Rust.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86"] }
# Material files (ADR 0092): RON text (MIT OR Apache-2.0), the format the owner chose,
# through serde (already in every build through the workspace hack); not an hour's work
# (comments, raw strings, escapes, enums, error positions).
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# A material type's parameter layout through Slang's reflection (ADR 0092).
engine_shader.workspace = true
# Localized text in packs (ADR 0102): the compiled tables, without the Fluent parser.
engine_loc.workspace = true
# Sound packs (ADR 0105): a file's format, rate and length measured when it is packed.
engine_audio.workspace = true
engine_audio_decode.workspace = true
# BC1-5, BC6H and BC7 block compression (MIT): a Rust port of Intel's ISPC Texture
# Compressor kernels, CPU only (no wgpu). ADR 0041; BC6H for HDR panoramas (ADR 0083), which
# brings `half` (MIT OR Apache-2.0) and `zerocopy` (BSD-2-Clause OR Apache-2.0 OR MIT).
block_compression = { version = "0.10", default-features = false, features = ["bc15", "bc6h", "bc7"] }
