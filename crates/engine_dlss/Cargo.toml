[package]
name = "engine_dlss"
description = "NVIDIA DLSS Super Resolution and DLAA through NVIDIA Streamline, from DLLs the user supplies (ADR 0063)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine_profiler.workspace = true
engine_render.workspace = true
engine_rhi.workspace = true
# The Upscaler interface DLSS implements, and TAAU's jitter rule (ADR 0063).
engine_upscale.workspace = true

# Loading the DLLs and checking NVIDIA's signature on them (WinVerifyTrust).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
# Math and half floats for the tests and the benchmark.
engine_core.workspace = true
# FSR 3.1, compared against in the tests and the benchmark.
engine_fsr.workspace = true
