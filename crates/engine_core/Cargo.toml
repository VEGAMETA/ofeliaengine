[package]
name = "engine_core"
description = "Engine foundation: math, memory, containers, job system, time, hashing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["mimalloc"]
# The engine's global allocator (ADR 0086): mimalloc 2.3.2 behind `engine_core::alloc`.
mimalloc = ["dep:mimalloc"]

[dependencies]
engine_profiler.workspace = true
# Feature unification of shared dependencies for build reuse (ADR 0077).
engine_workspace_hack.workspace = true
# Vectors, matrices, quaternions with SSE2 SIMD (MIT OR Apache-2.0, no dependencies; ADR 0012).
# `bytemuck`: glam types are plain data inside ECS components (ADR 0017).
glam = { version = "0.33", features = ["bytemuck"] }
# The global allocator (ADR 0086; MIT, the mimalloc 2.3.2 C sources built by cc, about
# 5 s): 3.3-4.7x the Windows heap on allocation-heavy work (bench/alloc-compare).
mimalloc = { version = "=0.1.52", default-features = false, features = ["v2"], optional = true }


[dev-dependencies]
# Baseline for benches/jobs.rs only; not linked into the engine (ADR 0002).
rayon = "1.12"

[[bench]]
name = "jobs"
harness = false

[[bench]]
name = "math"
harness = false

# Model checking of the lock-free queues: RUSTFLAGS="--cfg loom" cargo test -p engine_core --release loom
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
