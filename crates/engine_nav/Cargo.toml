[package]
name = "engine_nav"
description = "Navigation: navmeshes baked from level geometry, paths and queries on them (Recast and Detour, vendored)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
links = "recastnavigation"

[lints]
workspace = true

[dependencies]
# Feature unification of shared dependencies for build reuse (ADR 0077).
engine_workspace_hack.workspace = true
engine_core.workspace = true
engine_profiler.workspace = true

[build-dependencies]
# Compiles the vendored Recast and Detour sources and our shim (MIT OR Apache-2.0).
cc = { version = "1", features = ["parallel"] }
