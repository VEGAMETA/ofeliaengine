[package]
name = "engine_luau_analysis"
description = "Luau's own analysis (type checking, the linter) for the editor's code editor: modules in memory or on disk, the engine's type definitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
links = "luau_analysis"

[lints]
workspace = true

[dependencies]
engine_core.workspace = true
# The Luau 0.736 libraries Analysis links against (Ast, Config, Compiler, VM), built once
# by mlua-sys's vendored sources (luau0-src, MIT): the same ones `engine_script` runs, with
# the features its `mlua/luau-jit` gives them, so no build resolves them otherwise
# (ADR 0077).
mlua-sys = { version = "0.12", features = ["luau", "luau-codegen"] }

[build-dependencies]
# Compiles the vendored Luau Analysis sources (third_party/luau-analysis, MIT).
cc = { version = "1", features = ["parallel"] }
