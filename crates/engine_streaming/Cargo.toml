[package]
name = "engine_streaming"
description = "Streaming a cooked scene within the GPU memory budget: texture levels from GPU feedback and mesh detail levels by screen size, read from its pack through the I/O ring (ADR 0076)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Reading decoded mesh levels in place (already in the tree through engine_render).
bytemuck = { version = "1.25" }
engine_assets.workspace = true
engine_core.workspace = true
# Aligned read buffers for mesh levels (unbuffered reads).
engine_platform.workspace = true
engine_profiler.workspace = true
engine_render.workspace = true
engine_rhi.workspace = true
# Material files' parameter layouts through Slang's reflection (ADR 0092).
engine_shader.workspace = true
# A material file that does not load is logged (the version engine_rhi uses).
log = "0.4"
