[package]
name = "engine_net_transport"
description = "Network transport: encrypted UDP connections with connect tokens, reliable and unreliable channels, an in-memory network simulator, and NAT traversal for hosts (UPnP IGD, PCP, NAT-PMP, STUN hole punching, relays). ADR 0070."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine_profiler.workspace = true
thiserror = "2"

# Already in the tree (ADR 0004). AES-256-GCM and the random number generator come from
# Windows CNG (bcrypt.dll): no crypto crate (measured against RustCrypto and ring in
# bench/net-crypto, ADR 0070). Sockets and the default route from Winsock and IP Helper.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_IO",
] }

[[example]]
name = "net_bench"

[[example]]
name = "nat_probe"
