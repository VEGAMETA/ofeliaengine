[package]
name = "engine_physics"
description = "Physics backend interface and shared types (CLAUDE.md §8, ADR 0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine_core.workspace = true
# The `ecs` module: components and sync with the ECS (feature `ecs`, on by default; off,
# the physics interface stands alone).
engine_ecs = { workspace = true, optional = true }
engine_profiler.workspace = true
# Plain-data proofs for the ECS components (already a dependency of engine_ecs; ADR 0017).
bytemuck = { version = "1.25", features = ["derive"], optional = true }

[features]
default = ["ecs"]
ecs = ["dep:engine_ecs", "dep:bytemuck"]
