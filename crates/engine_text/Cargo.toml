[package]
name = "engine_text"
description = "Text: fonts, shaping (HarfRust), line breaking, layout, glyph rasterization and atlas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Feature unification of shared dependencies for build reuse (ADR 0077).
engine_workspace_hack.workspace = true
harfrust = "=0.13.3"
skrifa = "=0.46.0"
# UAX #9's character data (Unicode 16; MIT OR Apache-2.0, the Servo Project): its
# algorithm is adapted in `bidi.rs` to buffers kept between calls (its own allocates on
# every call, ADR 0102).
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data", "std"] }
unicode-linebreak = "=0.1.5"
unicode-script = "=0.5.8"

[dev-dependencies]
# The golden image of text in both directions (`tests/bidi_golden.rs`); already in the tree
# through engine_assets.
png = "0.18"

[[bench]]
name = "text"
harness = false
