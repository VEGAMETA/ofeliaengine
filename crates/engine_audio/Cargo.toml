[package]
name = "engine_audio"
description = "Audio: lock-free mixer with buses, sends, virtual voices and effects; WASAPI output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine_core.workspace = true
engine_profiler.workspace = true

# The mixer is platform-independent (and tested in Linux containers); the output device
# layer (WASAPI) is Windows-only.
[target.'cfg(windows)'.dependencies]
engine_platform.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[[bench]]
name = "mixer"
harness = false
