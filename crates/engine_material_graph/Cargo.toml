[package]
name = "engine_material_graph"
description = "Material graphs (ADR 0123): nodes and links that generate one Slang material type."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Tracy zones (CLAUDE.md §14).
engine_profiler.workspace = true
# The `.graph` file in the editor's grammar (ADR 0108): its fields reflected, written and
# read by the scene crate, a texture node's image an asset reference.
engine_reflect.workspace = true
engine_scene.workspace = true
# Feature unification of shared dependencies for build reuse (ADR 0077).
engine_workspace_hack.workspace = true

[dev-dependencies]
# The generated modules checked by Slang's front end inside `forward.slang` (ADR 0092).
engine_shader.workspace = true
