[package]
name = "engine_app"
description = "The player (ADR 0099): what a game's executable owns. The process set-up, the window and its swapchain, the device, latency control, the pipeline cache, the streamed scene, the frame renderer and the runtime, driven by the game's hooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine_core.workspace = true
engine_ecs.workspace = true
engine_frame.workspace = true
engine_latency.workspace = true
engine_platform.workspace = true
engine_profiler.workspace = true
engine_render.workspace = true
engine_render2d.workspace = true
engine_rhi.workspace = true
engine_runtime.workspace = true
engine_streaming.workspace = true
# DLSS frame generation through Streamline, with DLLs the user supplies (ADR 0091).
engine_dlss.workspace = true
# Videos (ADR 0100): decoding, the conversion pass, the sound through an audio output.
engine_video.workspace = true
engine_audio.workspace = true
# The sources' sound files (ADR 0105): Vorbis, Opus and FLAC decoded on the loading thread.
engine_audio_decode.workspace = true
# A scene's physics (ADR 0101): the pack's colliders as Jolt bodies the game steps.
engine_assets.workspace = true
engine_collision.workspace = true
engine_physics.workspace = true
engine_physics_jolt.workspace = true
# The game's text (ADR 0102): strings packs, or a `loc/` folder compiled and kept live.
engine_loc.workspace = true
engine_input.workspace = true
# Saves (ADR 0104): taken after the frame's ticks, written behind it, loaded at a tick
# boundary; the level's objects known by their `SceneId`.
engine_save.workspace = true
engine_scene.workspace = true
engine_reflect.workspace = true
# Luau scripts in the game (ADR 0114, E7-1a): the VM the script host runs.
engine_script.workspace = true
# Blockout brushes (ADR 0110): their groups evaluated, a mesh per brush.
engine_brush.workspace = true
# The pack's navigation mesh as the world's resource (ADR 0103).
engine_nav.workspace = true
# Networking (ADR 0106): the session the player runs, its transport and NAT traversal.
engine_net.workspace = true
engine_net_transport.workspace = true
# Text errors of a live folder go to the log (engine_log's backend).
log = "0.4"
# A baked blockout group's glTF (ADR 0110 E2b-6): the file's JSON chunk.
serde_json = "1"

[dev-dependencies]
# The flight example: skinned characters (glTF Fox) cooked through the derived data cache,
# its PSO record.
bytemuck = { version = "1.25", features = ["derive"] }
engine_anim.workspace = true
engine_assets.workspace = true
