[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "tests/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
# MIT as a placeholder until the final license is chosen, before the first release
# (ADR 0020). Nothing is published.
license = "MIT"
publish = false

[workspace.dependencies]
engine_assets = { path = "crates/engine_assets" }
engine_audio = { path = "crates/engine_audio" }
engine_audio_decode = { path = "crates/engine_audio_decode" }
engine_core = { path = "crates/engine_core" }
engine_text = { path = "crates/engine_text" }
engine_ecs = { path = "crates/engine_ecs" }
engine_input = { path = "crates/engine_input" }
engine_latency = { path = "crates/engine_latency" }
engine_physics = { path = "crates/engine_physics" }
engine_physics_jolt = { path = "crates/engine_physics_jolt" }
engine_physics2d = { path = "crates/engine_physics2d" }
engine_scene = { path = "crates/engine_scene" }
engine_editor = { path = "crates/engine_editor" }
engine_platform = { path = "crates/engine_platform" }
engine_profiler = { path = "crates/engine_profiler" }
engine_reflect = { path = "crates/engine_reflect" }
engine_script = { path = "crates/engine_script" }
engine_reflect_derive = { path = "crates/engine_reflect_derive" }
engine_render = { path = "crates/engine_render" }
engine_render2d = { path = "crates/engine_render2d" }
engine_upscale = { path = "crates/engine_upscale" }
engine_ui = { path = "crates/engine_ui" }
engine_rhi = { path = "crates/engine_rhi" }
engine_shader = { path = "crates/engine_shader" }

[workspace.lints.rust]
# CLAUDE.md §15: every unsafe operation inside an unsafe fn needs its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
# CLAUDE.md §15: every unsafe block carries a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Hot paths must not panic (CLAUDE.md §5); make panicking shortcuts visible in review.
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# ---------------------------------------------------------------------------------------
# Build profiles (CLAUDE.md §15, ADR 0001).
# ---------------------------------------------------------------------------------------

# Our crates: light optimization so the editor/game stay usable in dev builds.
[profile.dev]
opt-level = 1

# Third-party crates: full optimization. They rarely change, so the cost is paid once.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
incremental = false

# Release + full debug info for Tracy callstacks and symbol resolution.
[profile.profiling]
inherits = "release"
debug = "full"

# What players get.
[profile.shipping]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
